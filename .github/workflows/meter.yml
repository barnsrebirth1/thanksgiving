name: Update meter
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meter
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: site
      - uses: actions/checkout@v5
        with:
          ref: meter-data
          path: data
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Count donations
        env:
          HELIUS_RPC: ${{ secrets.HELIUS_RPC }}
        run: node site/scripts/update-meter.mjs data/meter.json
      - name: Save
        working-directory: data
        run: |
          git config user.name "meter-bot"
          git config user.email "meter-bot@users.noreply.github.com"
          git add meter.json
          git diff --cached --quiet || (git commit -m "meter update" && git push)
